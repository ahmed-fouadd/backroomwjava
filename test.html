<!DOCTYPE html>
<html>

<head>
    <title>Ahmed's Backroom</title>
    <style>

        body {
            background-color: #ff1e1e;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            background-color: #855858;
            color: rgba(255, 255, 255, 0.1); 
            outline: 1px solid #000;
            font-style: italic;
        }

        p {
            color: rgba(255, 255, 255, 0.5);
        }

        .greentext {
            color: green;
        }

        .inlineblocktext {
            display: inline-block;
        }
        a {
            color: green;
            text-decoration: none;
        }
        a:hover {
            color: lightgreen;
        }

    </style>
</head>


<body>

    <h1>This is a backroom.</h1>
    <p class="greentext inlineblocktext">This is a paragraph.</p>
    <p class="greentext">This is a paragraph.</p>
    <p class="greentext">This is a paragraph.</p>
    <a href="http://example.com">Click here to go to the next page.</a>
    


</body>

</html>
